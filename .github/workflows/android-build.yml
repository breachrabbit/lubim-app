# .github/workflows/android-build.yml
#
# Сборка Android APK из приложения "Гид по Любиму".
#
# Триггеры:
#   - push тегов v*.*.* (например, v1.0.0) → релизная сборка + публикация в Releases
#   - ручной запуск через UI GitHub (workflow_dispatch) — для отладки
#
# Результат: debug-подписанный APK в артефактах запуска и (для тегов) в GitHub Release.

name: Build Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Права workflow — нужны для создания GitHub Release при push тега.
# Без этого softprops/action-gh-release падает с ошибкой 403.
permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Capacitor 7 требует JDK 21.
      # actions/setup-java@v4 экспортирует переменную JAVA_HOME_21_X64
      # с путём к установленному JDK — её мы потом явно передаём Gradle.
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        env:
          BUILD_TARGET: capacitor
        run: npm run build

      # Создаём папку android/ при первом запуске.
      # На последующих запусках папка может быть в репозитории — тогда пропускаем.
      - name: Add Android platform (idempotent)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # Сборка APK с явным указанием JDK 21 для Gradle.
      # Параметр -Dorg.gradle.java.home гарантирует, что Gradle
      # использует именно JDK 21, даже если в системе по умолчанию
      # стоит другая версия.
      - name: Build debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lubim-guide-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Гид по Любиму ${{ github.ref_name }}"
          body: |
            ## Установка

            1. Скачайте файл **app-debug.apk** ниже
            2. Откройте его на Android-устройстве
            3. Если попросит — разрешите установку из неизвестных источников

            Сборка отладочная, подписана debug-ключом.
          draft: false
          prerelease: false
          generate_release_notes: true
